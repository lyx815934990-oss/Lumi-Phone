<p class="fore">黄灯亮了——要不要把伞往中间挪。</p>
<div class="stage"><div class="shell"><p class="title-custom">安全词 · 仪表盘</p><div class="stats"><span>词：伞</span><span>备用：灯</span></div><div class="gauge"><div class="g gg" id="g">绿</div><div class="g gy on" id="y">黄</div><div class="g gr" id="r">红</div></div><div class="row" id="msg">黄灯：节奏放慢 · 靠过来一点先问一句</div><button class="btn" type="button" data-l="g">切绿</button><button class="btn" type="button" data-l="y">切黄</button><button class="btn" type="button" data-l="r">切红</button><div class="npc"><span class="av">🛡️</span><div><b>协议</b>：红灯即停。剧情向。</div></div><div class="foot">互动切换</div></div></div>
<script>
(function(){var map={g:["继续 · 呼吸平稳","g"],y:["放慢 · 先问愿不愿意","y"],r:["立即停 · 喝水盖毯","r"]};var btns=document.querySelectorAll(".btn[data-l]");for(var i=0;i<btns.length;i++){btns[i].addEventListener("click",function(){var l=this.getAttribute("data-l");document.getElementById("g").classList.remove("on");document.getElementById("y").classList.remove("on");document.getElementById("r").classList.remove("on");document.getElementById(l).classList.add("on");document.getElementById("msg").textContent=map[l][0]})}})();
</script>

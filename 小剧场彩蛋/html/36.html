<p class="fore">队友发起投票：是否踢出「装没事的人」。</p>
<div class="stage"><div class="shell"><p class="title-custom">投票 · 踢出伪装</p><div class="stats"><span>赞成 <b id="y">3</b></span><span>反对 <b id="n">1</b></span><span>弃权 0</span></div><div class="bar"><i id="bar" style="width:75%"></i></div><div class="row">动议：踢出总说「没事」的玩家</div><div class="row">附议：祁洵 · 理由：雨夜证据确凿</div><button class="btn" type="button" id="yes">赞成</button><button class="btn" type="button" id="no">反对</button><div class="npc"><span class="av">🎭</span><div><b>队长</b>：投完之前请先把关东煮吃完。</div></div><div class="foot">演示计数</div></div></div>
<script>
(function(){var y=3,n=1;function paint(){document.getElementById("y").textContent=String(y);document.getElementById("n").textContent=String(n);document.getElementById("bar").style.width=Math.round(y/(y+n)*100)+"%"}document.getElementById("yes").addEventListener("click",function(){y++;paint()});document.getElementById("no").addEventListener("click",function(){n++;paint()});paint()})();
</script>

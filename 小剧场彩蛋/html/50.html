<p class="fore">早晨的对话框——终于没再发没事。</p>
<div class="stage"><div class="shell"><p class="title-custom">聊天 · 晨间</p><div class="stats"><span>09:12</span><span>已读</span><span>雨停了</span></div>
<div class="bub ta"><span class="av">☔</span>祁洵：醒了吗。伞还在门口。</div>
<div class="bub me">醒了。草稿我还留着。</div>
<div class="bub ta">哪一句。</div>
<div class="bub me" id="line">其实不是没事。你别先走。</div>
<div class="bub ta">……我看到了。昨晚灯修好了。</div>
<div class="bub me">那我们还去便利店吗。</div>
<div class="bub ta">去。关东煮还是两份。</div>
<button class="btn" type="button" id="send">补发昨晚草稿</button>
<div class="npc"><span class="av">☀️</span><div id="ok"><b>系统</b>：发送键不再灰显。</div></div>
<div class="foot">收束 · #50</div></div></div>
<script>
(function(){document.getElementById("send").addEventListener("click",function(){document.getElementById("ok").textContent="已补发 · 对方正在输入…";this.classList.add("dis")})})();
</script>

<p class="fore">密码是伞——输对才见那张加星的。</p>
<div class="stage"><div class="shell"><p class="title-custom">私密相册 · 保险柜</p><div class="lock" id="code">····</div><div class="keys"><button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button><button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button><button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button><button class="key" data-k="C">清</button><button class="key" data-k="0">0</button><button class="key" data-k="OK">开</button></div><div class="vault" id="vault"><div class="row">★ 伞下侧脸 · 备注：别删</div><div class="row">雨夜蒸汽 · 加锁</div><div class="row">未发送截图 · 仅本地</div></div><div class="npc"><span class="av">🔐</span><div><b>提示</b>：演示密码 2580</div></div><div class="foot">物证向</div></div></div>
<script>
(function(){var buf="";var code=document.getElementById("code");var vault=document.getElementById("vault");function paint(){code.textContent=(buf+"····").slice(0,4).split("").join(" ")}var keys=document.querySelectorAll(".key");for(var i=0;i<keys.length;i++){keys[i].addEventListener("click",function(){var k=this.getAttribute("data-k");if(k==="C"){buf="";vault.classList.remove("on");paint();return}if(k==="OK"){if(buf==="2580")vault.classList.add("on");else code.textContent="错误";return}if(buf.length<4)buf+=k;paint()})}paint()})();
</script>

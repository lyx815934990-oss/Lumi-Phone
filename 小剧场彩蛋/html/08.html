<p class="fore">距离过近会预警——可他偏偏靠过来一点。</p>
<div class="stage"><img class="hero" alt="预警" src="https://image.pollinations.ai/prompt/medical%20radar%20ui%20blue%20dark%20interface%20abstract%20no%20people"><div class="shell"><p class="title-custom">社交距离 · 过敏预警</p><div class="stats"><span>目标 祁洵</span><span id="dist">当前 0.4 m</span><span>阈值：高</span></div><div class="radar"><div class="blip" id="blip"></div></div><div class="row" style="background:#1a2434;cursor:default">触发词：靠过来一点 / 别先走 / 伞</div><div class="row" style="background:#1a2434;cursor:default">建议：保持一臂伞半径 · 或关闭预警装作没事</div><button class="btn" type="button" id="mute">暂时静音 5 秒</button><div class="npc"><span class="av">🩺</span><div><b>系统</b>：非医疗建议。数据更新于 23:40。</div></div><div class="foot">仅供剧情 · 便利店旁实测</div></div></div>
<script>
(function(){var d=document.getElementById("dist");var b=document.getElementById("mute");var on=true;setInterval(function(){if(!on||!d)return;d.textContent="当前 "+(0.3+Math.random()*0.5).toFixed(2)+" m"},800);if(b)b.addEventListener("click",function(){on=false;b.textContent="已静音";setTimeout(function(){on=true;b.textContent="暂时静音 5 秒"},5000)})})();

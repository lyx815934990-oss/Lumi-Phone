<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>#35 存档读档 · 小剧场</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:auto;overflow:auto;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
.egg-nav{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 12px;background:rgba(20,18,16,.92);color:#f0e6d8;font-size:12px;backdrop-filter:blur(8px)}
.egg-nav a{color:#f5d78a;text-decoration:none}
.egg-nav b{flex:1;text-align:center;font-weight:650;letter-spacing:.04em}
.egg-nav span{opacity:.4}
.fore{max-width:800px;margin:0 auto;padding:10px 16px 0;text-align:center;font-size:12px;font-style:italic;opacity:.75;line-height:1.5}
.title-custom{margin:0;font-weight:700}
body{background:#0b0f14;color:#9dffc2;font-family:ui-monospace,Consolas,"PingFang SC",monospace;}
.stage{max-width:800px;margin:0 auto;padding:0 12px 32px}
.shell{border-radius:14px;overflow:hidden;border:1px solid #2a4a3a;box-shadow:0 0 40px #1a3a2844;background:#10161c}
.title-custom{margin:0;padding:14px 16px;font-size:16px;color:#7dffb0;border-bottom:1px solid #243028;letter-spacing:.08em}
.stats{display:flex;flex-wrap:wrap;gap:10px;padding:8px 14px;font-size:11px;opacity:.85}
.row{margin:6px 12px;padding:10px;border-radius:8px;background:#1a2420;border:1px solid #243028;font-size:12px;line-height:1.55}
.btn{margin:8px 12px;padding:9px 14px;border:1px solid #3dff9a55;background:#1a2820;color:#7dffb0;border-radius:8px;cursor:pointer;font-weight:700}
.btn.dis{opacity:.4;pointer-events:none}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#243028;margin-right:6px}
.npc{margin:10px 12px;padding:10px;background:#1a2420;border-radius:10px;font-size:12px;display:flex;gap:8px}
.foot{padding:10px 14px 16px;font-size:10px;opacity:.5}
.bar{height:10px;background:#1a2820;border-radius:99px;overflow:hidden;margin:8px 12px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3dff9a,#c9a24b);transition:width .4s}
.hero{width:100%;height:110px;object-fit:cover;display:block}
.slot{cursor:pointer}.slot.on{border-color:#7dffb0;box-shadow:0 0 0 1px #7dffb0}
</style>
</head>
<body>
<div class="egg-nav"><a href="../index.html">目录</a><a href="./34.html">上一张</a><b>#35 存档读档</b><a href="./36.html">下一张</a></div>
<p class="fore">读档会丢掉「未发送」——确定吗？</p>
<div class="stage"><div class="shell"><p class="title-custom">读档选择</p><div class="stats"><span>自动存 3</span><span>手动 2</span></div><div class="row slot on" data-s="1"><b>槽位 1</b> · 雨夜便利店<div class="m">好感 91%（隐）· 草稿未发</div></div><div class="row slot" data-s="2"><b>槽位 2</b> · 一周前<div class="m">还在说没事</div></div><div class="row slot" data-s="3"><b>槽位 3</b> · 初遇<div class="m">伞骨尚未歪</div></div><button class="btn" type="button" id="load">读档</button><div class="npc"><span class="av">⚠️</span><div id="warn"><b>警告</b>：将覆盖当前未发送草稿。</div></div><div class="foot">点选槽位</div></div></div>
<script>
(function(){var slots=document.querySelectorAll(".slot");var cur=1;for(var i=0;i<slots.length;i++){slots[i].addEventListener("click",function(){for(var j=0;j<slots.length;j++)slots[j].classList.remove("on");this.classList.add("on");cur=Number(this.getAttribute("data-s"))})}document.getElementById("load").addEventListener("click",function(){document.getElementById("warn").textContent="已读档至槽位 "+cur+"（演示）"})})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自动更新弹窗 · 具体数值对比</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px 48px; background: #1a1a1c; color: #e8e6e3;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
    .lead { font-size: 13px; color: #9a9690; margin: 0 0 22px; line-height: 1.55; max-width: 820px; }
    .grid {
      display: grid; gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      max-width: 860px;
    }
    .wrap {
      background: #242426; border: 1px solid #333; border-radius: 14px; padding: 12px;
    }
    .wrap h2 { margin: 0 0 4px; font-size: 14px; }
    .wrap p { margin: 0 0 10px; font-size: 11px; color: #8e8a84; line-height: 1.45; }
    canvas { width: 100%; height: auto; border-radius: 10px; display: block; background: #000; }
  </style>
</head>
<body>
  <h1>自动更新弹窗 · 原先 → 现在</h1>
  <p class="lead">
    不再只提示「有变化」：人生账本展示字段具体数值；尾声延展展示条目正文摘要对比。
  </p>
  <div class="grid">
    <div class="wrap">
      <h2>A · 尾声延展 · 水墨书脊</h2>
      <p>条目名 + 原先 / 现在正文摘要</p>
      <canvas id="wb" width="360" height="620"></canvas>
    </div>
    <div class="wrap">
      <h2>B · 人生账本 · LIFE DOSSIER</h2>
      <p>字段卡片：原先 → 现在</p>
      <canvas id="ll" width="360" height="620"></canvas>
    </div>
  </div>
  <script>
    function rr(ctx, x, y, w, h, r) {
      const R = Math.min(r, w / 2, h / 2)
      ctx.beginPath()
      ctx.moveTo(x + R, y)
      ctx.arcTo(x + w, y, x + w, y + h, R)
      ctx.arcTo(x + w, y + h, x, y + h, R)
      ctx.arcTo(x, y + h, x, y, R)
      ctx.arcTo(x, y, x + w, y, R)
      ctx.closePath()
    }

    function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {
      const chars = String(text || '').split('')
      let line = '', yy = y, lines = 0
      for (let i = 0; i < chars.length; i++) {
        const test = line + chars[i]
        if (ctx.measureText(test).width > maxW && line) {
          ctx.fillText(line, x, yy)
          line = chars[i]
          yy += lineH
          lines++
          if (maxLines && lines >= maxLines) {
            ctx.fillText(line.slice(0, Math.max(0, line.length - 1)) + '…', x, yy)
            return yy + lineH
          }
        } else {
          line = test
        }
      }
      if (line) { ctx.fillText(line, x, yy); yy += lineH }
      return yy
    }

    /* ── A · 世界书 ── */
    ;(function drawWorldbook() {
      const c = document.getElementById('wb')
      const ctx = c.getContext('2d')
      const W = 360, H = 620
      const PAGE = '#EDEBE7', CARD = '#F8F7F4', INK = '#1E2024'
      const FOIL = '#5A6574', MUTED = '#6A6E76', LINE = '#D2D0CB', PAPER = '#F4F0E8'

      ctx.fillStyle = 'rgba(18, 20, 24, 0.58)'
      ctx.fillRect(0, 0, W, H)

      const cx = 28, cy = 40, cw = 304, ch = 540
      ctx.fillStyle = 'rgba(0,0,0,0.22)'
      rr(ctx, cx + 4, cy + 8, cw, ch, 16); ctx.fill()
      rr(ctx, cx, cy, cw, ch, 16)
      ctx.fillStyle = CARD; ctx.fill()
      ctx.strokeStyle = LINE; ctx.lineWidth = 1.25; ctx.stroke()

      // spine
      ctx.fillStyle = INK
      ctx.beginPath()
      ctx.moveTo(cx + 22, cy)
      ctx.lineTo(cx + 14, cy)
      ctx.arcTo(cx, cy, cx, cy + 14, 16)
      ctx.lineTo(cx, cy + ch - 14)
      ctx.arcTo(cx, cy + ch, cx + 14, cy + ch, 16)
      ctx.lineTo(cx + 22, cy + ch)
      ctx.closePath()
      ctx.fill()
      ctx.save()
      ctx.translate(cx + 11, cy + ch / 2)
      ctx.rotate(-Math.PI / 2)
      ctx.fillStyle = CARD
      ctx.font = '700 9px "Courier New", monospace'
      ctx.textAlign = 'center'
      ctx.fillText('EPILOGUE', 0, 0)
      ctx.restore()

      const ix = cx + 36, iy = cy + 18, iw = cw - 52, ih = ch - 90
      rr(ctx, ix, iy, iw, ih, 12)
      ctx.fillStyle = PAGE; ctx.fill()
      ctx.strokeStyle = LINE; ctx.lineWidth = 1; ctx.stroke()

      ctx.fillStyle = FOIL
      ctx.font = '600 9px "Courier New", monospace'
      ctx.textAlign = 'left'
      ctx.fillText('02 LORE  ·  AFTER PATCH', ix + 14, iy + 24)
      ctx.strokeStyle = LINE
      ctx.beginPath(); ctx.moveTo(ix + 14, iy + 34); ctx.lineTo(ix + iw - 14, iy + 34); ctx.stroke()

      ctx.fillStyle = INK
      ctx.font = '700 18px "Songti SC", serif'
      ctx.fillText('尾声延展已更新', ix + 14, iy + 60)

      rr(ctx, ix + 14, iy + 72, 72, 20, 999)
      ctx.fillStyle = INK; ctx.fill()
      ctx.fillStyle = CARD
      ctx.font = '600 11px sans-serif'
      ctx.textAlign = 'center'
      ctx.fillText('写入 1 条', ix + 50, iy + 86)
      ctx.textAlign = 'left'

      ctx.fillStyle = MUTED
      ctx.font = '300 12px sans-serif'
      ctx.fillText('下列条目正文已覆盖写入（摘要）：', ix + 14, iy + 112)

      // entry card
      const ex = ix + 14, ey = iy + 124, ew = iw - 28, eh = 150
      rr(ctx, ex, ey, ew, eh, 10)
      ctx.fillStyle = CARD; ctx.fill()
      ctx.strokeStyle = LINE; ctx.stroke()

      ctx.fillStyle = INK
      ctx.font = '700 12px "Songti SC", serif'
      ctx.fillText('大学日常线', ex + 10, ey + 22)
      ctx.fillStyle = FOIL
      ctx.font = '600 8px "Courier New", monospace'
      ctx.fillText('角色世界书', ex + 10, ey + 36)

      ctx.strokeStyle = LINE
      ctx.beginPath(); ctx.moveTo(ex, ey + 46); ctx.lineTo(ex + ew, ey + 46); ctx.stroke()

      ctx.fillStyle = '#9AA0A8'
      ctx.font = '600 8px "Courier New", monospace'
      ctx.fillText('原先', ex + 10, ey + 62)
      ctx.fillStyle = MUTED
      ctx.font = '400 11px sans-serif'
      wrapText(ctx, '仍住宿舍，周末偶尔回家；和室友关系普通。', ex + 10, ey + 78, ew - 20, 15, 2)

      ctx.strokeStyle = LINE
      ctx.beginPath(); ctx.moveTo(ex, ey + 108); ctx.lineTo(ex + ew, ey + 108); ctx.stroke()

      ctx.fillStyle = FOIL
      ctx.font = '600 8px "Courier New", monospace'
      ctx.fillText('现在', ex + 10, ey + 124)
      ctx.fillStyle = INK
      ctx.font = '600 11px sans-serif'
      wrapText(ctx, '已搬去合租；周末常与用户一起复习期末。', ex + 10, ey + 140, ew - 20, 15, 2)

      ctx.fillStyle = '#9AA0A8'
      ctx.font = '400 11px sans-serif'
      ctx.fillText('可在人设 · 世界书中翻开查看完整正文。', ix + 14, iy + ih - 16)

      const btnY = cy + ch - 54
      rr(ctx, cx + 36, btnY, cw - 52, 40, 999)
      ctx.fillStyle = INK; ctx.fill()
      ctx.fillStyle = CARD
      ctx.font = '600 14px sans-serif'
      ctx.textAlign = 'center'
      ctx.fillText('知道了', cx + cw / 2 + 6, btnY + 26)
      ctx.textAlign = 'left'
    })()

    /* ── B · 人生账本 ── */
    ;(function drawLedger() {
      const c = document.getElementById('ll')
      const ctx = c.getContext('2d')
      const W = 360, H = 620
      const BG = '#F3ECDD', CARD = '#FAFAF8', INK = '#2E271C'
      const MIST = '#9C8D6C', STAMP = '#C9574F'

      ctx.fillStyle = 'rgba(28, 22, 16, 0.55)'
      ctx.fillRect(0, 0, W, H)

      const cx = 28, cy = 36, cw = 304, ch = 548
      ctx.fillStyle = 'rgba(0,0,0,0.2)'
      rr(ctx, cx + 5, cy + 7, cw, ch, 10); ctx.fill()
      rr(ctx, cx, cy, cw, ch, 10)
      ctx.fillStyle = BG; ctx.fill()
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke()

      const ix = cx + 14, iy = cy + 14, iw = cw - 28, ih = ch - 78
      rr(ctx, ix, iy, iw, ih, 8)
      ctx.fillStyle = CARD; ctx.fill()
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke()

      ctx.fillStyle = MIST
      ctx.font = '600 9px "Courier New", monospace'
      ctx.textAlign = 'left'
      ctx.fillText('LIFE DOSSIER', ix + 12, iy + 22)
      ctx.textAlign = 'right'
      ctx.fillText('AUTO UPDATE', ix + iw - 12, iy + 22)
      ctx.textAlign = 'left'

      ctx.strokeStyle = INK; ctx.lineWidth = 2
      ctx.beginPath(); ctx.moveTo(ix + 12, iy + 32); ctx.lineTo(ix + iw - 12, iy + 32); ctx.stroke()
      ctx.lineWidth = 0.75
      ctx.beginPath(); ctx.moveTo(ix + 12, iy + 36); ctx.lineTo(ix + iw - 12, iy + 36); ctx.stroke()

      ctx.save()
      ctx.translate(ix + iw - 46, iy + 70)
      ctx.rotate(-0.22)
      rr(ctx, -32, -14, 64, 28, 4)
      ctx.strokeStyle = STAMP; ctx.lineWidth = 2; ctx.stroke()
      ctx.fillStyle = STAMP
      ctx.font = '700 10px "Courier New", monospace'
      ctx.textAlign = 'center'
      ctx.fillText('UPDATED', 0, 4)
      ctx.restore()
      ctx.textAlign = 'left'

      ctx.fillStyle = INK
      ctx.font = '700 18px "FangSong", serif'
      ctx.fillText('人生账本已更新', ix + 12, iy + 68)

      ctx.fillStyle = MIST
      ctx.font = '400 12px "FangSong", serif'
      ctx.fillText('模型已写入下列登记变更（原先 → 现在）：', ix + 12, iy + 92)

      const rows = [
        { label: '角色·存款', prev: '约8万', next: '约12万' },
        { label: '角色·主业', prev: '在校大学生', next: '实习产品助理' },
        { label: '角色·感情', prev: '暗恋还没说破', next: '确认彼此心意' },
      ]
      let y = iy + 108
      rows.forEach((r) => {
        const h = 78
        rr(ctx, ix + 12, y, iw - 24, h, 6)
        ctx.fillStyle = BG; ctx.fill()
        ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke()

        ctx.fillStyle = STAMP
        ctx.font = '700 11px sans-serif'
        ctx.fillText(r.label, ix + 22, y + 18)
        ctx.fillRect(ix + iw - 30, y + 1, 6, 6)

        ctx.strokeStyle = 'rgba(46,39,28,0.18)'
        ctx.beginPath(); ctx.moveTo(ix + 12, y + 26); ctx.lineTo(ix + iw - 12, y + 26); ctx.stroke()

        ctx.fillStyle = MIST
        ctx.font = '600 8px "Courier New", monospace'
        ctx.fillText('原先', ix + 22, y + 40)
        ctx.font = '400 11px "FangSong", serif'
        ctx.fillText(r.prev, ix + 22, y + 54)

        ctx.fillStyle = 'rgba(201,87,79,0.08)'
        ctx.fillRect(ix + 13, y + 58, iw - 26, h - 59)

        ctx.fillStyle = STAMP
        ctx.font = '600 8px "Courier New", monospace'
        ctx.fillText('现在', ix + 22, y + 70)
        ctx.fillStyle = INK
        ctx.font = '700 11px "FangSong", serif'
        ctx.fillText(r.next, ix + 58, y + 70)

        y += h + 8
      })

      ctx.fillStyle = MIST
      ctx.font = '400 11px sans-serif'
      ctx.fillText('可在资料卡或人设里的人生账本查看完整登记。', ix + 12, iy + ih - 14)

      const btnY = cy + ch - 50
      rr(ctx, cx + 14, btnY, cw - 28, 38, 8)
      ctx.fillStyle = INK; ctx.fill()
      ctx.fillStyle = BG
      ctx.font = '700 14px sans-serif'
      ctx.textAlign = 'center'
      ctx.fillText('知道了', cx + cw / 2, btnY + 24)
      ctx.textAlign = 'left'
    })()
  </script>
</body>
</html>
